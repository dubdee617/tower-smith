<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Tower of Hope</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tower of Hope">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#16120f">
<meta name="theme-color" content="#14100d">
<style>
:root{color-scheme:dark;--bg:#14100d;--panel:#211a15;--line:#4a3a2c;--ink:#efe3cc;--dim:#a89679;--ember:#ff8a3d;--ember2:#ffc069;--hp:#d9553f;--ap:#5fb0e6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:16px/1.45 "Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-text-size-adjust:100%}
/* 1画面: 上から 見出し／絵（上に寄せる）／HP／文章（残り）／ボタン */
main{max-width:520px;height:100vh;height:100dvh;margin:0 auto;display:flex;flex-direction:column;gap:6px;padding:calc(22px + env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom))}
.top{flex:none;display:flex;gap:8px;align-items:center;justify-content:space-between;height:28px}
.top b{color:var(--ember2);font-weight:700;font-size:17px;white-space:nowrap}.top span{color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stage{flex:none;position:relative;display:flex;align-items:flex-start;justify-content:center}
.box{position:relative;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:#000;flex:none}
.view canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
.view #cv{left:50%;right:auto;width:auto;aspect-ratio:4/3;min-width:100%;transform:translateX(-50%)}
#map{position:absolute;right:6px;top:6px;width:28%;height:auto;aspect-ratio:1/1;opacity:.92;border-radius:6px;image-rendering:pixelated;border:1px solid rgba(255,192,105,.5);transition:all .2s;z-index:3}
#map.big{right:7%;top:6%;width:86%;opacity:.97}
.town>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.town .hot{position:absolute;background:transparent;border:2px solid transparent;border-radius:10px;min-height:0;padding:0}
.town .hot:active,.town .hot:focus-visible{border-color:var(--ember2);background:rgba(255,192,105,.18)}
.town .bg{inset:-12px;width:calc(100% + 24px);height:calc(100% + 24px);filter:blur(4px) brightness(.45)}
.town .fg{inset:6% 4% 4%;width:92%;height:90%;object-fit:contain}
.intro .log,.intro .bars{display:none}
.intro .ctl{display:flex;justify-content:flex-end}.intro .ctl .btns{display:block}
.intro .ctl button{min-height:34px;width:96px;font-size:14px;background:transparent;border-color:rgba(255,255,255,.18);color:var(--dim)}
.cine{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);padding:30px 10px;text-align:center;font-size:clamp(15px,4.6vw,19px);line-height:1.95;letter-spacing:.03em;color:#fff3d6;text-shadow:0 2px 4px #000,0 0 14px rgba(0,0,0,.95);background:linear-gradient(transparent,rgba(0,0,0,.5) 22%,rgba(0,0,0,.5) 78%,transparent);pointer-events:none;transition:opacity .5s}
.cine:empty{display:none}
.cine span{display:block;opacity:0;animation:lineIn 1.1s ease-out forwards}
.cine span.q{color:#ffd27a}
.cine.out{opacity:0}
@keyframes lineIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.town .caption{position:absolute;left:0;right:0;top:12%;text-align:center;font-size:34px;letter-spacing:.12em;color:#fff3d6;text-shadow:0 2px 0 #3a1a08,0 0 12px rgba(0,0,0,.8),0 0 2px #000}
.town .name{position:absolute;left:8px;top:6px;font-size:15px;font-weight:700;color:var(--ember2);text-shadow:0 1px 2px #000,0 0 6px #000;z-index:4}
.bars{flex:none;display:grid;grid-template-columns:auto 1fr auto auto 1fr auto;gap:2px 8px;align-items:center;font-size:13px}
.bar{height:8px;background:#000;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%}
.log{flex:1 1 auto;min-height:120px;position:relative;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:7px 10px;overflow:hidden;font-size:16px;line-height:1.5;white-space:pre-line}
.log.hasface{padding-right:82px}
.log .face{position:absolute;right:7px;top:7px;width:64px;height:84px;object-fit:cover;object-position:50% 0;border-radius:8px;border:2px solid var(--line);background:radial-gradient(circle at 50% 35%,#5a4330,#20160f 75%)}
.ctl{flex:none;margin-top:auto}
/* 塔の中: 絵は4:3のまま。余った高さは文章でなく、ボタン（十字キー）を大きくする */
.dg .log{flex:0 0 112px}
.dg .ctl{flex:1 1 auto;display:flex;flex-direction:column;justify-content:flex-end}
.dg .pad{flex:1 1 auto;grid-auto-rows:1fr;max-height:220px}.dg .pad button{height:100%}
.dg .ctl>.btns:not(.tail){flex:1 1 auto;grid-auto-rows:1fr;max-height:280px}
.dg .ctl>.btns.three:not(.small){max-height:150px}
.btns{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.btns.three{grid-template-columns:repeat(3,1fr)}
.btns.one{grid-template-columns:1fr}
.btns.one button small{white-space:normal}
.btns.list{grid-template-columns:repeat(2,1fr)}.btns.list button{text-align:left;padding:4px 8px}
.btns.list button small{white-space:normal;line-height:1.35}
button.dim{opacity:.55;border-style:dashed}
button i.lack{font-style:normal;font-size:11px;color:#ff8a7a;margin-left:6px}
.btns.small button{font-size:15px;padding:3px 4px}
.btns.tail{display:flex;margin-top:6px}.btns.tail button{flex:1}.btns.tail .pg{flex:0 0 52px;font-size:18px}
.tabs{display:flex;gap:4px;margin-bottom:6px}
.tabs button{flex:1;min-height:36px;font-size:15px;border-radius:8px 8px 3px 3px;background:#1b1511;color:var(--dim)}
.tabs button.on{background:#5a2a10;border-color:var(--ember);color:#fff3d6;font-weight:700}
button{font:inherit;font-size:16px;color:var(--ink);background:#2c231c;border:2px solid var(--line);border-radius:9px;min-height:48px;padding:3px 6px;cursor:pointer;touch-action:manipulation;line-height:1.25}
button:disabled{opacity:.4}
button.hot{border-color:var(--ember);background:#5a2a10}
button small{display:block;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pad button{font-size:26px;min-height:56px}
h2{font-size:14px;margin:0 0 2px;color:var(--ember2);font-weight:600}
.story .bars,.story #who{visibility:hidden}
.title .log{display:none}
/* 立ち絵: 左右・全身／腰から上を出し分けて、入ってくる・呼吸する・話すと弾む */
.fig{position:absolute;top:0;bottom:0;width:58%;display:flex;justify-content:center;align-items:flex-end;pointer-events:none;z-index:2}
.fig.L{left:-3%;animation:figL .5s cubic-bezier(.2,.8,.3,1)}.fig.R{right:-3%;animation:figR .5s cubic-bezier(.2,.8,.3,1)}
.fig.C{left:21%;animation:figC .5s ease-out}
.fig img{flex:none;height:97%;width:auto;filter:drop-shadow(0 0 8px rgba(0,0,0,.85));transform-origin:50% 100%;animation:breathe 3.6s ease-in-out infinite}
.fig.bust{align-items:flex-start}.fig.bust img{height:205%;margin-top:4%;transform-origin:50% 30%}
.fig.wide{width:100%;left:0}.fig.wide img{height:85%}
.fig.talk img{animation:hop .4s ease-out}
.fig::after{content:"";position:absolute;inset:auto 0 0 0;height:30%;background:linear-gradient(transparent,rgba(0,0,0,.35));pointer-events:none}
@keyframes figL{from{opacity:0;transform:translateX(-50px)}}
@keyframes figR{from{opacity:0;transform:translateX(50px)}}
@keyframes figC{from{opacity:0;transform:translateY(20px)}}
@keyframes breathe{50%{transform:scale(1.008,1.016)}}
@keyframes hop{30%{transform:translateY(-8px) scale(1.01)}60%{transform:translateY(0)}}
.fig span{position:absolute;bottom:6px;font-size:15px;font-weight:700;color:#fff3d6;text-shadow:0 1px 2px #000,0 0 6px #000;z-index:1}
.fig.L span{left:12px}.fig.R span{right:12px}
/* 暗転 */
#fade{position:fixed;inset:0;z-index:50;background:#000;opacity:0;pointer-events:none;transition:opacity .24s ease;display:flex;align-items:center;justify-content:center;text-align:center;color:#ffc069;font-size:20px;letter-spacing:.25em;line-height:1.9}
#fade.on{opacity:1;pointer-events:auto}
/* 2026-11-25: 自宅で眠る（夜 → 朝の光と回復の光） */
#sleep{position:fixed;inset:0;z-index:52;pointer-events:auto;opacity:0;transition:opacity .5s ease;background:radial-gradient(ellipse at 50% 30%,#1b2448,#070912 70%);overflow:hidden}
#sleep.on{opacity:1}
#sleep .moon{position:absolute;left:62%;top:14%;width:54px;height:54px;border-radius:50%;box-shadow:-12px 6px 0 0 #f3e7b8;transform:rotate(-20deg);filter:drop-shadow(0 0 10px rgba(243,231,184,.5));transition:opacity .8s}
#sleep .st{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;animation:twk 1.6s ease-in-out infinite}
@keyframes twk{0%,100%{opacity:.15}50%{opacity:1}}
#sleep .z{position:absolute;left:44%;top:56%;font-family:Dot,sans-serif;color:#cfd8ff;font-size:26px;opacity:0;animation:zz 1.8s ease-out forwards;text-shadow:0 0 8px rgba(160,180,255,.7)}
@keyframes zz{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(46px,-120px) scale(1.3)}}
#sleep .dawn{position:absolute;inset:0;opacity:0;transition:opacity .7s ease;background:radial-gradient(ellipse at 50% 85%,rgba(255,214,140,.95),rgba(255,160,90,.55) 35%,rgba(60,40,60,.0) 75%),linear-gradient(#3a2a40,#8a5a4a 60%,#ffcf8a)}
#sleep.day .dawn{opacity:1}#sleep.day .moon,#sleep.day .st{opacity:0}
#sleep .hp{position:absolute;bottom:-20px;width:8px;height:8px;border-radius:50%;background:radial-gradient(#fff,#9dffb4 40%,rgba(80,255,140,0) 70%);opacity:0;animation:hpup 1.9s ease-out forwards}
@keyframes hpup{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translateY(-70vh) scale(1.4)}}
#sleep .msg{position:absolute;left:0;right:0;top:44%;text-align:center;font-family:Dot,sans-serif;font-size:22px;letter-spacing:.2em;color:#fff3d6;text-shadow:0 2px 6px #000;opacity:0;transition:opacity .6s}
#sleep.day .msg{opacity:1}

#fade.txt div{animation:glow 1.1s ease-in-out infinite}
#fade.txt i{display:block;width:120px;height:3px;margin:10px auto 0;border-radius:2px;background:linear-gradient(90deg,transparent,#ff8a3d,transparent);animation:spark .45s ease-in-out infinite}
@keyframes glow{50%{text-shadow:0 0 14px #ff8a3d,0 0 28px rgba(255,120,40,.5)}}
@keyframes spark{50%{opacity:.2;transform:scaleX(.6)}}
#fade.floor{flex-direction:column;letter-spacing:.15em;color:#efe3cc;font-size:17px}
#fade.floor div::first-line{font-size:46px;font-weight:700;color:#ffc069;letter-spacing:.08em}
#fade.floor div{animation:floorIn 1.4s ease-out both}
#fade.floor i{animation:none;width:180px;opacity:.7}
@keyframes floorIn{from{opacity:0;transform:translateY(8px)}25%{opacity:1;transform:none}}
/* 遭遇 */
#flash{position:fixed;inset:0;z-index:40;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 35%,rgba(255,245,170,.95),rgba(255,205,60,.75) 60%,rgba(255,170,40,.6))}
#flash.on{animation:yflash .55s ease-out}
#flash.boss{background:radial-gradient(circle at 50% 35%,rgba(255,230,150,.95),rgba(255,90,40,.75) 60%,rgba(160,20,20,.6))}
@keyframes yflash{0%{opacity:0}12%{opacity:.9}100%{opacity:0}}
.quake{animation:quake .45s linear}
@keyframes quake{10%{transform:translate(-5px,3px)}25%{transform:translate(5px,-4px)}40%{transform:translate(-4px,-2px)}55%{transform:translate(3px,4px)}70%{transform:translate(-2px,-1px)}85%{transform:translate(1px,1px)}}
.enc{position:absolute;left:0;right:0;top:38%;z-index:5;display:flex;align-items:baseline;justify-content:center;gap:14px;padding:8px 0;background:linear-gradient(90deg,transparent,rgba(20,10,0,.85) 20%,rgba(20,10,0,.85) 80%,transparent);border-top:1px solid rgba(255,200,90,.6);border-bottom:1px solid rgba(255,200,90,.6);pointer-events:none;animation:encIn 1.5s ease-out forwards}
.enc b{font-size:28px;color:#ffd75a;letter-spacing:.15em;text-shadow:0 0 10px rgba(255,180,40,.8)}
.enc span{font-size:20px;color:#fff3d6;text-shadow:0 1px 3px #000}
.enc.boss b{color:#ff6a4a;text-shadow:0 0 12px rgba(255,60,30,.9)}
@keyframes encIn{0%{opacity:0;transform:translateX(-60px) scaleY(.4)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateX(40px)}}
.ctl.wait{pointer-events:none;opacity:.55;transition:opacity .2s}
/* レベルアップ */
#lvup{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 45%,rgba(90,55,10,.85),rgba(12,8,4,.92) 70%);transition:opacity .35s}
#lvup.on{opacity:1;pointer-events:auto}
#lvup div{text-align:center;display:flex;flex-direction:column;gap:6px}
#lvup b{font-size:44px;letter-spacing:.08em;color:#ffe27a;text-shadow:0 0 14px rgba(255,190,60,.9),0 3px 0 #6a3a00}
#lvup.on b{animation:lvPop .6s cubic-bezier(.2,1.6,.4,1)}
#lvup em{font-style:normal;font-size:26px;color:#fff3d6;font-weight:700}
#lvup span{font-size:17px;color:#fff3d6}
#lvup small{font-size:13px;color:var(--dim)}
@keyframes lvPop{from{transform:scale(.3);opacity:0}}
#lvup b.gold{font-size:52px;color:#ffd75a}
#lvup.reward span{font-size:15px;max-width:300px}
/* 戦闘: 行動の予定 */
.plan{display:flex;align-items:center;gap:5px;height:34px;margin-bottom:6px;overflow:hidden;white-space:nowrap}
.plan .ap{flex:none;font-weight:700;color:#7cc4ff;font-size:15px;padding:0 4px}
.plan .hint{color:var(--dim);font-size:13px}
.plan .chip{flex:0 1 auto;min-height:30px;height:30px;padding:0 8px;font-size:13px;border-radius:15px;background:#3a2716;border-color:var(--ember);color:#ffe2b8;overflow:hidden;text-overflow:ellipsis}
.btns.four{grid-template-columns:repeat(4,1fr);margin-bottom:6px}.btns.four button{min-height:44px;font-size:15px}
.btns.cmd{margin-bottom:6px}.btns.cmd button.on{border-color:var(--ember2);background:#4a3010}
.dg .ctl>.btns.one,.dg .ctl>.btns:not(.tail):not(.three):not(.four){max-height:120px}
#view:has(.fig) #map{opacity:0}
.dg .ctl>.btns.three.cmd:not(.x){flex:1 1 auto;grid-auto-rows:minmax(46px,80px);max-height:172px}
/* スキルの一覧（塔の絵の上） */
.skp{position:absolute;inset:0;z-index:4;background:rgba(14,10,6,.9);display:flex;flex-direction:column;gap:4px;padding:6px 8px;animation:figC .2s ease-out}
.skh{display:flex;align-items:center;justify-content:space-between;color:#7cc4ff;font-weight:700;font-size:15px;padding:0 2px}
.skh .x{min-height:30px;height:30px;width:40px;padding:0;font-size:16px}
.skr{display:grid;grid-template-columns:1fr auto;align-items:baseline;text-align:left;min-height:0;padding:5px 10px;gap:0 8px;flex:1 1 0;max-height:58px}
.skr .nm{font-size:16px;font-weight:700;color:#fff3d6}.skr .apv{font-size:14px;color:#7cc4ff;font-weight:700}
.skr small{grid-column:1/-1;font-size:12.5px;white-space:normal;overflow:visible;line-height:1.3}
.skr{min-height:0;overflow:hidden}
@media (max-height:740px){.skr small{display:none}.skr{padding:2px 10px;align-items:center}.skr .nm{font-size:15px}}
.btns.sk button{min-height:46px}
.dg .ctl>.btns.sk{flex:0 1 auto;grid-auto-rows:minmax(46px,58px)}
.btns.tail .undo{flex:0 0 26%}
.dg .ctl>.btns.four{flex:0 0 auto}
/* ステータス */
.status{position:absolute;inset:0;z-index:3;display:grid;grid-template-columns:30% 40% 30%;align-items:center;background:radial-gradient(ellipse at 50% 60%,rgba(60,40,20,.55),rgba(10,7,4,.88) 75%)}
.shero{position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center}
.shero img{height:96%;width:auto;max-width:150%;object-fit:contain;filter:drop-shadow(0 0 10px rgba(0,0,0,.9))}
.shero img.in{animation:figC .45s ease-out}
.sjob{position:absolute;left:-30%;right:-30%;bottom:4px;text-align:center;font-weight:700;font-size:15px;color:#ffc069;text-shadow:0 1px 3px #000,0 0 8px #000}
.scol{display:flex;flex-direction:column;gap:12px;padding:0 6px}
.srow .sl{display:flex;align-items:baseline;gap:4px;font-size:12px;color:var(--dim)}
.srow .sl b{font-size:17px;color:#fff3d6;margin-left:auto}
.srow .sl em{font-style:normal;font-size:12px;font-weight:700;min-width:0}
.srow .sl em.up{color:#7ee07e}.srow .sl em.down{color:#ff7a6a}
.sbar{height:8px;background:rgba(0,0,0,.6);border-radius:4px;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.sbar i{display:block;height:100%;width:0;transition:width .6s cubic-bezier(.2,.8,.3,1)}
/* HPが少ないとき */
#danger{position:fixed;inset:0;z-index:39;pointer-events:none;opacity:0;transition:opacity .6s;box-shadow:inset 0 0 60px 12px rgba(220,20,10,.65),inset 0 0 140px 24px rgba(140,0,0,.3)}
#danger.on{opacity:1;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.btns.tail .auto{flex:0 0 24%}.btns.tail .auto.on{border-color:#7cc4ff;background:#16324a;color:#cfe9ff}
/* 話している人の顔: セリフ欄の外、枠なし */
#spk{position:absolute;bottom:0;height:128px;width:auto;z-index:6;pointer-events:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.9));display:none}
#spk.on{display:block;animation:spkIn .3s ease-out}
#spk.L{left:-2px}#spk.R{right:-2px}
@keyframes spkIn{from{opacity:0;transform:translateY(10px)}}
.portrait{position:absolute;right:0;top:0;bottom:0;width:42%;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.town .portrait img{position:static;width:auto;height:100%;max-width:100%;object-fit:contain;filter:drop-shadow(0 0 6px rgba(0,0,0,.8))}
.portrait.ev{width:62%;left:19%;right:auto;background:none;animation:figC .5s ease-out}
.portrait.ev.wide{width:96%;left:2%}.portrait.ev.wide img{width:100%;height:auto;max-height:96%;object-fit:contain}
.portrait.ev.panel img{border-radius:10px;border:1px solid var(--line);box-shadow:0 0 18px rgba(0,0,0,.7)}
.meet.ev{width:60%;right:20%;background:none}
.top .snd{min-height:0;height:28px;width:34px;padding:0;font-size:15px;border-radius:7px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ember2);flex:none}
.top .snd.off{color:#6b5a4a;text-decoration:line-through}
.town .statues{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:space-around;padding:4% 2% 2%;background:radial-gradient(ellipse at 50% 90%,#3a2a1a,#120c08 70%)}
.town .statues img{position:static;width:19%;height:auto;max-height:92%;object-fit:contain;filter:brightness(.55) saturate(.6)}
.town .statues img.lit{filter:brightness(1.1) drop-shadow(0 0 8px #ffd98a) drop-shadow(0 0 16px rgba(255,210,120,.6))}
.meet{position:absolute;right:0;top:0;bottom:0;width:45%;display:none;align-items:flex-end;justify-content:center;pointer-events:none;z-index:2}
.meet img{height:100%;width:auto;max-width:100%;object-fit:contain;filter:drop-shadow(0 0 6px rgba(0,0,0,.8))}
.town .arrow{position:absolute;left:36%;width:28%;bottom:1%;height:auto;min-height:0;padding:4px 0;font-size:15px;color:#fff3d6;background:rgba(60,30,10,.8);border:2px solid var(--ember2);border-radius:8px;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.note{font-size:13px;color:var(--dim);margin-top:4px}
</style>
<link rel="stylesheet" href="js/ui2.css">
<link rel="preload" href="assets/font/dot.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
<main>
 <div class="top"><b id="where">Tower of Hope</b><span id="who"></span><button id="cfg" class="snd" aria-label="設定・セーブ">≡</button><button id="snd" class="snd" aria-label="音のオンオフ">♪</button></div>
