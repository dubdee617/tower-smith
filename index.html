<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Tower of Hope</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tower of Hope">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#16120f">
<meta name="theme-color" content="#14100d">
<style>
:root{color-scheme:dark;--bg:#14100d;--panel:#211a15;--line:#4a3a2c;--ink:#efe3cc;--dim:#a89679;--ember:#ff8a3d;--ember2:#ffc069;--hp:#d9553f;--ap:#5fb0e6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.4 "Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
/* 1画面にすべて収める: 上から 見出し／画面（残りの高さ全部）／HP・AP／文章／ボタン */
main{max-width:520px;height:100vh;height:100dvh;margin:0 auto;display:flex;flex-direction:column;gap:6px;padding:calc(6px + env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom))}
.top{flex:none;display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.top b{color:var(--ember2);font-weight:600}.top span{color:var(--dim);font-size:12px}
#stage{flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center}
.box{position:relative;border:3px solid var(--line);border-radius:10px;overflow:hidden;background:#000;flex:none}
.view canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
#map{position:absolute;right:6px;top:6px;width:30%;height:auto;aspect-ratio:1/1;opacity:.9;border-radius:4px;image-rendering:pixelated}
.town img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.town .hot{position:absolute;background:transparent;border:2px solid transparent;border-radius:10px;min-height:0;padding:0}
.town .hot:active,.town .hot:focus-visible{border-color:var(--ember2);background:rgba(255,192,105,.18)}
.town .bg{inset:-12px;width:calc(100% + 24px);height:calc(100% + 24px);filter:blur(4px) brightness(.45)}
.town .fg{inset:6% 6% 4%;width:88%;height:90%;object-fit:contain}
.town .caption{position:absolute;left:0;right:0;top:12%;text-align:center;font-size:34px;letter-spacing:.12em;color:#fff3d6;text-shadow:0 2px 0 #3a1a08,0 0 12px rgba(0,0,0,.8),0 0 2px #000}
.town .caption b{font-weight:700}
.town .name{position:absolute;left:8px;top:6px;font-size:13px;color:var(--ember2);text-shadow:0 1px 2px #000,0 0 6px #000}
.bars{flex:none;display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:center;font-size:12px}
.bar{height:7px;background:#000;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%}
.log{flex:none;background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:5px 8px;height:72px;overflow:hidden;font-size:13px;line-height:1.35;white-space:pre-line}
.ctl{flex:none}
.btns{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}
.btns.three{grid-template-columns:repeat(3,1fr)}
.btns.small button{min-height:38px;font-size:13px;padding:2px 4px}
button{font:inherit;color:var(--ink);background:#2c231c;border:2px solid var(--line);border-radius:8px;min-height:44px;padding:3px 6px;cursor:pointer;touch-action:manipulation;line-height:1.2}
button:disabled{opacity:.4}
button.hot{border-color:var(--ember);background:#5a2a10}
button small{display:block;font-size:10px;color:var(--dim)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.pad button{font-size:20px;min-height:48px}
h2{font-size:13px;margin:0;color:var(--ember2);font-weight:600}
.story .bars,.story #who{visibility:hidden}
.title .log{display:none}
.log{position:relative}
.log.hasface{padding-left:74px}
.log .face{position:absolute;left:4px;top:3px;width:62px;height:62px;object-fit:cover;object-position:50% 15%;border-radius:6px;border:1px solid var(--line);background:#20160f}
.portrait{position:absolute;right:0;top:0;bottom:0;width:42%;display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.55) 35%);pointer-events:none}
.town .portrait img{position:static;width:auto;height:100%;max-width:100%;object-fit:contain;filter:drop-shadow(0 0 6px rgba(0,0,0,.8))}
.portrait.wide{width:70%}
.portrait.ev{width:56%;left:22%;right:auto;background:none}
.portrait.ev.panel img{border-radius:10px;border:1px solid var(--line);box-shadow:0 0 18px rgba(0,0,0,.7)}
.meet.ev{width:60%;right:20%;background:none}
.top .snd{margin-left:8px;min-height:0;height:24px;width:30px;padding:0;font-size:14px;border-radius:6px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ember2)}
.top .snd.off{color:#6b5a4a;text-decoration:line-through}
.town .statues{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:space-around;padding:4% 2% 2%;background:radial-gradient(ellipse at 50% 90%,#3a2a1a,#120c08 70%)}
.town .statues img{position:static;width:24%;height:auto;max-height:92%;object-fit:contain;filter:brightness(.55) saturate(.6)}
.town .statues img.lit{filter:brightness(1.1) drop-shadow(0 0 8px #ffd98a) drop-shadow(0 0 16px rgba(255,210,120,.6))}
.meet{position:absolute;right:0;top:0;bottom:0;width:45%;display:none;align-items:flex-end;justify-content:center;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.6) 35%);pointer-events:none}
.meet img{height:100%;width:auto;max-width:100%;object-fit:contain;filter:drop-shadow(0 0 6px rgba(0,0,0,.8))}
.town .arrow{position:absolute;left:38%;width:24%;bottom:1%;height:auto;min-height:0;padding:3px 0;font-size:14px;color:#fff3d6;background:rgba(60,30,10,.75);border:2px solid var(--ember2);border-radius:8px;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.portrait span{position:absolute;bottom:4px;right:6px;font-size:14px;color:#fff3d6;text-shadow:0 1px 2px #000,0 0 6px #000}
.note{font-size:11px;color:var(--dim);margin-top:4px}
</style>
</head>
<body>
<main>
 <div class="top"><b id="where">Tower of Hope</b><span id="who"></span><button id="snd" class="snd" aria-label="音のオンオフ">♪</button></div>
 <div id="stage">
  <div class="box town" id="town"></div>
  <div class="box view" id="view"><canvas id="cv" width="320" height="240"></canvas><canvas id="map" width="64" height="64"></canvas><div class="meet" id="meet"></div></div>
 </div>
 <div class="bars">
  <span>HP</span><div class="bar"><i id="hpb" style="background:var(--hp)"></i></div><span id="hpt"></span>
  <span id="apl">AP</span><div class="bar" id="apbar"><i id="apb" style="background:var(--ap)"></i></div><span id="apt"></span>
 </div>
 <div class="log" id="log"></div>
 <div class="ctl" id="ctl"></div>
</main>
<script src="js/assets.js"></script>
<script src="js/props.js"></script>
<script src="js/fx.js"></script>
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/sound.js"></script>
<script src="js/game.js"></script>
<script src="js/events.js"></script>
<script>try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}</script>
</body>
</html>
